<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ChatGPT on the App Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="app-store-page">
  <div id="main-content">
    <header class="app-header">
      <h1 class="product-header__title">ChatGPT</h1>
      <h2 class="product-header__identity">OpenAI</h2>
    </header>

    <div class="information-list">
      <div class="information-list__item">
        <span class="information-list__item__term">Seller</span>
        <span class="information-list__item__definition">OpenAI, L.L.C.</span>
      </div>
      <div class="information-list__item">
        <span class="information-list__item__term">Size</span>
        <span class="information-list__item__definition">64.5 MB</span>
      </div>
    </div>

    <section class="in-app-purchases-section">
      <h3 class="section-title">In-App Purchases</h3>
      <ol class="list--in-app-purchases">
        <li class="list-item">
          <span class="list-item__title">ChatGPT Plus</span>
          <span class="list-item__price">$19.99</span>
        </li>
        <li class="list-item">
          <span class="list-item__title">ChatGPT Team</span>
          <span class="list-item__price">$29.99</span>
        </li>
        <li class="list-item">
          <span class="list-item__title">ChatGPT Pro</span>
          <span class="list-item__price">$199.99</span>
        </li>
      </ol>
    </section>

    <!-- Apple App Store SSR serialized hydration data -->
    <script type="application/json" id="serialized-server-data">
    [
      {
        "data": {
          "id": "6448311069",
          "type": "apps",
          "attributes": {
            "name": "ChatGPT",
            "bundleId": "com.openai.chat",
            "artistName": "OpenAI",
            "offers": [
              {
                "type": "buy",
                "priceFormatted": "Free"
              }
            ]
          },
          "relationships": {
            "shelves": {
              "data": [
                {
                  "id": "in-app-purchases",
                  "type": "shelves"
                }
              ]
            }
          }
        }
      },
      {
        "data": {
          "content": {
            "sections": [
              {
                "title": "Information",
                "items": [
                  {
                    "$kind": "textPair",
                    "leadingText": "Provider",
                    "trailingText": "OpenAI, L.L.C."
                  }
                ]
              },
              {
                "title": "In-App Purchases",
                "items": [
                  {
                    "$kind": "textPair",
                    "leadingText": "ChatGPT Plus",
                    "trailingText": "$19.99"
                  },
                  {
                    "$kind": "textPair",
                    "leadingText": "ChatGPT Team",
                    "trailingText": "$29.99"
                  },
                  {
                    "$kind": "textPair",
                    "leadingText": "ChatGPT Pro",
                    "trailingText": "$199.99"
                  }
                ]
              }
            ]
          }
        }
      }
    ]
    </script>
  </div>
</body>
</html>
