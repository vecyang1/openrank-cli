[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrank"
version = "0.1.0"
description = "Global pricing, subscription rankings, and currency arbitrage spreads CLI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Vec Yang", email = "vecyang1@users.noreply.github.com" },
]
keywords = [
    "openrank",
    "otr",
    "pricing",
    "arbitrage",
    "subscriptions",
    "currency",
    "apple-storefront",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.scripts]
openrank = "openrank.cli:main"
otr = "openrank.cli:main"

[project.urls]
Homepage = "https://opentherank.com"
Documentation = "https://github.com/vecyang1/openrank-cli#readme"
Repository = "https://github.com/vecyang1/openrank-cli"
"Issue Tracker" = "https://github.com/vecyang1/openrank-cli/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["openrank*"]
namespaces = false

[tool.setuptools.package-data]
openrank = ["data/*.json"]
"openrank.data" = ["*.json"]
